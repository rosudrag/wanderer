<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ChewyTech">
  <title>ChewyTech</title>
  <defs>
    <linearGradient id="ct-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="ct-arc" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ct-tile)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#0ea5e9" stroke-opacity="0.28" stroke-width="8"/>

  <!-- chain arc: an open "C" drawn as a wormhole chain -->
  <path d="M 353 145 A 140 140 0 1 0 353 367"
        fill="none" stroke="url(#ct-arc)" stroke-width="58" stroke-linecap="round"/>

  <!-- chain nodes at the open ends and the hub in the centre -->
  <circle cx="353" cy="145" r="37" fill="#e0f2fe"/>
  <circle cx="353" cy="367" r="37" fill="#e0f2fe"/>
  <circle cx="256" cy="256" r="36" fill="#0ea5e9"/>
  <circle cx="256" cy="256" r="14" fill="#0d0d0d"/>
</svg>
